<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSchool | Avaliação Física</title>
    <style>
        :root {
            --roxo: #5423a8;
            --roxo-escuro: #241047;
            --amarelo: #f4c430;
            --fundo: #f5f2fb;
            --texto: #241d32;
            --borda: #ded7ec;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f2fb 0%, #fffdf7 100%);
            color: var(--texto);
            font-family: Georgia, 'Times New Roman', serif;
        }

        main {
            width: min(920px, calc(100% - 32px));
            margin: 40px auto;
        }

        .cabecalho {
            background: var(--roxo-escuro);
            border-radius: 12px 12px 0 0;
            color: white;
            padding: 30px clamp(22px, 5vw, 54px);
            border-bottom: 7px solid var(--amarelo);
        }

        .cabecalho p {
            color: #e4d7ff;
            margin: 8px 0 0;
        }

        h1, h2 { margin: 0; }
        h1 { font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: 0; }
        h2 { color: var(--roxo); font-size: 1.5rem; margin-bottom: 20px; }

        .conteudo {
            background: white;
            border: 1px solid var(--borda);
            border-top: 0;
            border-radius: 0 0 12px 12px;
            display: grid;
            gap: 30px;
            grid-template-columns: minmax(0, 1fr) minmax(260px, .8fr);
            padding: clamp(22px, 5vw, 48px);
        }

        form { display: grid; gap: 16px; }
        .campo { display: grid; gap: 7px; }
        label { font-weight: bold; }
        input, select {
            border: 1px solid var(--borda);
            border-radius: 6px;
            font: inherit;
            padding: 12px;
            width: 100%;
        }
        input:focus, select:focus { border-color: var(--roxo); outline: 3px solid #e8ddff; }

        button {
            background: var(--roxo);
            border: 0;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font: bold 1rem Georgia, 'Times New Roman', serif;
            margin-top: 8px;
            padding: 14px;
        }
        button:hover { background: #42178b; }

        .resultado {
            align-self: start;
            background: var(--fundo);
            border-left: 5px solid var(--roxo);
            min-height: 230px;
            padding: 24px;
        }
        .resultado h2 { margin-bottom: 12px; }
        .resultado-vazio { color: #685d78; line-height: 1.6; }
        .categoria { color: var(--roxo); font-size: 1.6rem; font-weight: bold; }
        .imc { font-size: 1.2rem; }
        .erro { color: #a52626; line-height: 1.5; }
        .erro ul { margin: 8px 0 0; padding-left: 20px; }

        @media (max-width: 700px) {
            main { margin: 16px auto; }
            .conteudo { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <header class="cabecalho">
            <h1>FitSchool</h1>
            <p>Sistema de Avaliação Física</p>
        </header>

        <section class="conteudo">
            <div>
                <h2>Dados do aluno</h2>
                <form id="formulario-avaliacao">
                    <div class="campo">
                        <label for="nome">Nome do aluno</label>
                        <input id="nome" name="nome" type="text" required>
                    </div>
                    <div class="campo">
                        <label for="idade">Idade</label>
                        <input id="idade" name="idade" type="number" min="1" max="120" required>
                    </div>
                    <div class="campo">
                        <label for="genero">Gênero</label>
                        <input id="genero" name="genero" type="text" required>
                    </div>
                    <div class="campo">
                        <label for="peso">Peso (kg)</label>
                        <input id="peso" name="peso" type="number" min="0.1" step="0.1" required>
                    </div>
                    <div class="campo">
                        <label for="altura">Altura (m)</label>
                        <input id="altura" name="altura" type="number" min="0.1" max="3" step="0.01" required>
                    </div>
                    <div class="campo">
                        <label for="atividade">Nível de atividade física</label>
                        <select id="atividade" name="atividade" required>
                            <option value="">Selecione</option>
                            <option value="Alto">Alto</option>
                            <option value="Moderado">Moderado</option>
                            <option value="Baixo">Baixo</option>
                        </select>
                    </div>
                    <button type="submit">Avaliar aluno</button>
                </form>
            </div>

            <section class="resultado" id="resultado" aria-live="polite">
                <h2>Resultado</h2>
                <p class="resultado-vazio">Preencha os dados e clique em “Avaliar aluno”.</p>
            </section>
        </section>
    </main>

    <script>
        const niveisAtividade = ['Alto', 'Moderado', 'Baixo'];

        function validarDados(aluno) {
            const erros = [];
            if (!aluno.nome || aluno.nome.trim().length < 2) erros.push('Informe um nome válido.');
            if (!Number.isFinite(aluno.idade) || aluno.idade <= 0 || aluno.idade > 120) erros.push('A idade deve estar entre 1 e 120 anos.');
            if (!aluno.genero || aluno.genero.trim().length === 0) erros.push('Informe o gênero.');
            if (!Number.isFinite(aluno.peso) || aluno.peso <= 0) erros.push('O peso deve ser maior que zero.');
            if (!Number.isFinite(aluno.altura) || aluno.altura <= 0 || aluno.altura > 3) erros.push('A altura deve estar entre 0 e 3 metros.');
            if (!niveisAtividade.includes(aluno.atividade)) erros.push('Selecione um nível de atividade válido.');
            return erros;
        }

        function calcularImc(peso, altura) {
            return peso / (altura * altura);
        }

        function classificarCondicao(imc, atividade) {
            if (imc >= 18.5 && imc <= 24.9 && atividade === 'Alto') return 'Excelente';
            if (imc >= 18.5 && imc <= 24.9 && atividade === 'Moderado') return 'Bom';
            if (atividade === 'Baixo') return 'Regular';
            return 'Atenção';
        }

        function obterOrientacao(categoria) {
            const orientacoes = {
                Excelente: 'Parabéns! Seu condicionamento está excelente!',
                Bom: 'Muito bom! Continue mantendo bons hábitos!',
                Regular: 'Sua condição física pode melhorar. Tente ser mais ativo!',
                Atenção: 'Busque orientação profissional e cuide da sua saúde.'
            };
            return orientacoes[categoria];
        }

        document.querySelector('#formulario-avaliacao').addEventListener('submit', function (evento) {
            evento.preventDefault();
            const formulario = new FormData(evento.target);
            const aluno = {
                nome: formulario.get('nome'),
                idade: Number(formulario.get('idade')),
                genero: formulario.get('genero'),
                peso: Number(formulario.get('peso')),
                altura: Number(formulario.get('altura')),
                atividade: formulario.get('atividade')
            };
            const resultado = document.querySelector('#resultado');
            const erros = validarDados(aluno);

            if (erros.length > 0) {
                resultado.innerHTML = '<h2>Dados inválidos</h2><div class="erro"><ul>' + erros.map(erro => `<li>${erro}</li>`).join('') + '</ul></div>';
                return;
            }

            const imc = calcularImc(aluno.peso, aluno.altura);
            const categoria = classificarCondicao(imc, aluno.atividade);
            resultado.innerHTML = `<h2>Resultado</h2><p>Aluno: <strong>${aluno.nome.trim()}</strong></p><p class="imc">IMC: <strong>${imc.toFixed(2)}</strong></p><p>Categoria:</p><p class="categoria">${categoria}</p><p>${obterOrientacao(categoria)}</p>`;
        });
    </script>
</body>
</html>
